services:
  db:
    image: postgres:15.19-alpine
    volumes:
      - keycloak-db:/var/lib/postgresql/data
      - ./docker-test-config/db-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secret
      - POSTGRES_MULTIPLE_DATABASES=synapse,keycloak
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U root -d keycloak'"]
      interval: 10s
      timeout: 3s
      retries: 3

  keycloak:
    image: keycloak/keycloak:26.8.1
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9000:9000"
    environment:
      - KC_HOSTNAME=http://localhost:8080
      - KC_HTTP_ENABLED=true
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KEYCLOAK_LOGLEVEL=INFO
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db/keycloak
      - KC_DB_DATABASE=keycloak
      - KC_DB_USERNAME=root
      - KC_DB_PASSWORD=secret
    volumes:
      - ./docker-test-config/realm-export-local.json:/opt/keycloak/data/import/realm-export-local.json:ro
    command:
      - start
      - --import-realm
      - --health-enabled=true

  keycloak-health:
    image: curlimages/curl:8.23.0
    command: ["sh", "-c", "while true; do sleep 1; done"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --http1.1 http://keycloak:9000/health/ready -o /dev/null",
        ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 30s

  synapse:
    image: matrixdotorg/synapse:v1.163.2
    ports:
      - "8008:8008"
    volumes:
      - ./docker-test-config/mx-data:/data
      - ./docker-test-config/mx-conf:/mx-conf/
      - ./white_list_module/:/usr/local/lib/python3.13/site-packages/white_list_module
    depends_on:
      db:
        condition: service_healthy
      keycloak-health:
        condition: service_healthy
    environment:
      - SYNAPSE_CONFIG_PATH=/mx-conf/homeserver.yaml


  element:
    image: vectorim/element-web:v1.12.32
    ports:
      - "1983:80"
    volumes:
      - ./docker-test-config/element-config.json:/app/config.json

volumes:
  keycloak-db:
