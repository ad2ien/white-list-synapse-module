# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://matrix-org.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "matrix.local"
public_baseurl: http://localhost:8008/
serve_server_wellknown: true
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false
database:
  name: psycopg2
  txn_limit: 10000
  args:
    user: root
    password: secret
    dbname: synapse
    host: db
    port: 5432
    cp_min: 5
    cp_max: 10
log_config: "/data/matrix.local.log.config"
media_store_path: /data/media_store
registration_shared_secret: "rfFDSWR&.4C26b27gtCQuTp,*aSRf5sB.RMwL9G*39Kzf3r#T3"
report_stats: false
macaroon_secret_key: "PaA8zb1+pl+8R:us^A7.u~arj-7kEgiinJ4nyPH^^t#PR9Z1YI"
form_secret: "IHQ3ArqBn&Rv=rS*MP,5a#dii@;;85b4a5AQd-v4XmDLY2bd4X"
signing_key_path: "/data/matrix.local.signing.key"
use_insecure_ssl_client_just_for_testing_do_not_use: true
trusted_key_servers:
  - server_name: "matrix.org"
modules:
  - module: white_list_module.EasyWhiteList
    config:
      # Leave this empty until the whitelist room exists: with an empty room_id
      # the module allows everyone, which lets you bootstrap the
      # whitelist-manager account and create the room. Then set the real room ID
      # and restart Synapse.
      room_id: ""
      idp_id: "keycloak"
oidc_providers:
  - idp_id: keycloak
    idp_name: "Random Connect"
    # `discover: false` + explicit endpoints: the browser must be sent to
    # localhost:8080 (Keycloak's public KC_HOSTNAME), while Synapse itself must
    # reach Keycloak via the docker service name `keycloak:8080`.
    discover: false
    skip_verification: true
    issuer: "http://localhost:8080/realms/local"
    authorization_endpoint: "http://localhost:8080/realms/local/protocol/openid-connect/auth"
    token_endpoint: "http://keycloak:8080/realms/local/protocol/openid-connect/token"
    userinfo_endpoint: "http://keycloak:8080/realms/local/protocol/openid-connect/userinfo"
    jwks_uri: "http://keycloak:8080/realms/local/protocol/openid-connect/certs"
    client_id: "synapse"
    client_secret: "M5nXccmhTMzDldFs2FYQFTLJVAw8yjLk"
    scopes: ["openid", "profile"]
    user_mapping_provider:
      config:
        localpart_template: "{{ user.preferred_username }}"
        display_name_template: "{{ user.name }}"
    backchannel_logout_enabled: false
enable_registration: true
enable_registration_without_verification: true

# Dev-only: relaxed rate limits so repeated OIDC login attempts don't return 429.
rc_login:
  address:
    per_second: 100
    burst_count: 1000
  account:
    per_second: 100
    burst_count: 1000
  failed_attempts:
    per_second: 100
    burst_count: 1000
rc_registration:
  per_second: 100
  burst_count: 1000
